name: LLM EvalOps CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate-and-test:
    name: Run LLM Quality Gates & Regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Run Smoke Tests & Parameterized Golden Regressions
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL_NAME: "gemini-3.5-flash-lite"
          USE_GEMINI_MODEL: "Y"
        run: |
          uv run pytest tests/test_00_smoke.py tests/test_08_dataset_parametrized_regression.py -v --junitxml=reports/junit.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-junit-report
          path: reports/junit.xml
